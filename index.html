<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Chronologic</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
		}
		body {
			min-height: 100svh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0 32px;
			box-sizing: border-box;
			background-color: #cccccc;
			background-image:
				repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.025) 0 1px, transparent 1px 7px),
				repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.025) 0 1px, transparent 1px 7px);
		}
		#logo {
			display: block;
			max-width: min(100%, 600px);
			height: auto;
		}
	</style>
</head>
<body>
	<img id="logo" alt="Chronologic Cassette">
	<script>
		const logos = [
			"cassette_logo_monochromeyellow_nontextured.png",
			"cassette_logo_monochromeyellow_textured.png",
			"cassette_logo_multicol_nontextured.png",
			"cassette_logo_multicol_textured.png",
			"cassette_logo_redgoldgreen_nontextured.png",
			"cassette_logo_redgoldgreen_textured.png",
			"cassette_logo_tealretromulti_nontextured.png",
			"cassette_logo_tealretromulti_textured.png",
		];
		const choice = logos[Math.floor(Math.random() * logos.length)];
		document.getElementById("logo").src = "logos/" + choice;
	</script>
</body>
</html>
